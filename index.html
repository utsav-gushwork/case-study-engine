<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Study Engine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--ground:#f7f8f9;--ink:#0d0d0d;--muted:#6a7077;--accent:#0070ff;--border:#e7e8e9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ground);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
.card{max-width:520px;padding:48px;text-align:center}
.mark{width:36px;height:36px;margin:0 auto 20px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center}
.mark svg{width:20px;height:20px}
h1{font-size:26px;font-weight:700;margin:0 0 12px;letter-spacing:-0.01em}
p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 24px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:#e5f1ff;padding:6px 12px;border-radius:99px}
</style>
</head>
<body>
<div class="card">
<div class="mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.9826 1.36903C23.2508 0.708173 22.7549 0 22.0417 0H2.74286C1.22802 0 0 1.22802 0 2.74286V20.0333C0 21.6054 1.55124 22.7049 2.98809 22.0671C12.2548 17.9535 19.3135 10.4122 22.9826 1.36903Z"/><path d="M9.75483 24C9.42067 24 9.28073 23.5659 9.54777 23.3651C16.4702 18.158 21.4301 10.7414 23.6297 2.41566C23.6821 2.21746 24 2.25485 24 2.45985V21.2571C24 22.772 22.772 24 21.2571 24H9.75483Z"/></svg></div>
<h1>Case Study Engine</h1>
<p>Reserved for the bulk case-study generator — turns a CSV or doc of client results into on-brand pages, published live from one dynamic route. Build in progress.</p>
<span class="status">Project reserved — not yet built</span>
</div>
</body>
</html>
